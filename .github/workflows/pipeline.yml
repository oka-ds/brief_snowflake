name: Pipeline NYC Taxi

on:
  # Chaque 1er du mois à 6h UTC
  schedule:
    - cron: "0 6 1 * *"
  # Lancement manuel depuis l'onglet Actions
  workflow_dispatch:

# Identifiants Snowflake stockés dans les secrets du dépôt GitHub
env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -e .

      - name: Charger les données dans RAW
        run: python src/load_data.py

      - name: Lancer les transformations et les tests dbt
        working-directory: dbt_nyc_taxi
        run: dbt build
